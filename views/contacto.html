<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <!--CSS-->
    <link rel="stylesheet" href="/restaurante_best_burger/recursos\estilos/estilos.css">
    
    <title>Lista de Empleados</title>
</head>
<body>

    <div class="header">
        <nav>
            <ul class="ul-navbar">
                <li>
                    <img class="logo" src="/restaurante_best_burger/recursos/imagenes/logo-best-burger.png" alt="">
                </li>
                <li><a class="titulo-marca" href="/restaurante_best_burger/views/inicio.html"> BEST BURGER </a></li>
                <li><a href="/restaurante_best_burger/views/quienes_somos.html">Quiénes Somos?</a></li>
                <li><a href="/restaurante_best_burger/views/menu_especial.html">Menú Especial</a></li>
                <li><a href="/restaurante_best_burger/views/lista_empleados.html">Lista de Empleados</a></li>
                <li><a href="/restaurante_best_burger/views/contacto.html">Contacto</a></li>
            </ul>
        </nav>
    </div>

    <div>
        <section>
            <form class="form-contacto">
                <fieldset>
                    <legend class="legend-form">
                        Formulario de Contacto
                    </legend>
                    <label class="descripcion-contacto" for="">Escríbenos, nos pondremos en contacto contigo lo más pronto posible.</label>
                    <br><br>
                    <div>
                        <label for="">
                            Nombre 
                        </label>
                        <input type="text" name="nombre" placeholder="Ingresa tu nombre"><br>
                    </div>
                    <div>
                        <label for="">
                            Teléfono
                        </label>
                        <input type="number" name="telefono" placeholder="Ingresa tu número teléfonico"><br>
                    </div>
                    <div>
                        <label for="">
                            Email
                        </label>
                        <input type="text" name="email" placeholder="Ingresa tu email"><br>
                    </div>
                    <div>
                        <label for="">
                            Comentario
                        </label>
                        <textarea name="comentario" cols="30" rows="10"></textarea>
                    </div>
                <input type="button" value="Enviar">
            </form>
        </section>
    </div>

    <div class="footer">
        <footer>
            <h3>@Copyright Best Burger 2022</h3>
            <div>
                <h4>Visita Nuestras Redes Sociales:</h4>
                <img class="logo-redes" src="/restaurante_best_burger/recursos/imagenes/facebook.png" alt="">
                <img class="logo-redes" src="/restaurante_best_burger/recursos/imagenes/instagram.png" alt="">
                <img class="logo-redes" src="/restaurante_best_burger/recursos/imagenes/twitter.png" alt="">
                <img class="logo-redes" src="/restaurante_best_burger/recursos/imagenes/youtube.png" alt="">
            </div>
        </footer>
    </div>

</body>
</html>
